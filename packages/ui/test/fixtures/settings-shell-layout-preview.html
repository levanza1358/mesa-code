<!doctype html>
<!--
  Reproduction of the Settings page shell layout.

  The page uses:
    grid-cols-[var(--workspace-sidebar-width)_minmax(0,1fr)]

  `--workspace-sidebar-width` is provided by WorkspaceSidebarWidthProvider and
  defaults to 264px. When Settings is active the workspace shell stays mounted but
  transparent (see RootWorkspaceContent), so the first grid column is a reserved
  strip that renders nothing. With only the settings nav and the content pane as
  children, the nav lands in column 1 and the content in column 2, and the
  reserved width can read as a gap between the two.

  This page renders both arrangements so the difference is visible:

    "current"  -> reserved column present (the reported layout)
    "fixed"    -> reserved column removed; nav + content only

  Developer aid only; not part of the product build.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Settings shell layout</title>
    <style>
      :root {
        --workspace-sidebar-width: 264px;
        --bg: #0d110f;
        --sidebar: #151a17;
        --panel: #101512;
        --border: #2a332d;
        --fg: #e6ece8;
        --fg-subtle: #7d8f84;
        --accent: #24312a;
        --brand: #4ade80;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.4 system-ui, sans-serif;
      }

      .wrap {
        padding: 16px;
        display: grid;
        gap: 24px;
      }

      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--fg-subtle);
        margin: 0 0 8px;
      }

      /* Outer window frame. */
      .frame {
        position: relative;
        height: 320px;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }

      /* Simulates the workspace shell that stays mounted but transparent. */
      .workspace-shell {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: var(--workspace-sidebar-width) minmax(0, 1fr);
        opacity: 0;
        pointer-events: none;
      }

      .workspace-sidebar {
        background: var(--sidebar);
        border-right: 1px solid var(--border);
      }

      /* The settings layer paints over the workspace shell. */
      .settings-layer {
        position: absolute;
        inset: 0;
        z-index: 10;
      }

      /* current: the ORIGINAL arrangement, kept so the regression is visible.
         It reserves a `--workspace-sidebar-width` column that nothing fills,
         which pushes the nav into column 2. */
      .shell-current {
        display: grid;
        grid-template-columns: var(--workspace-sidebar-width) minmax(0, 1fr);
        height: 100%;
      }

      /* fixed: the nav takes its own fixed column at the left edge and content
         fills the rest, matching SettingsPage after the fix. */
      .shell-fixed {
        display: grid;
        grid-template-columns: 264px minmax(0, 1fr);
        height: 100%;
      }

      .nav {
        background: var(--sidebar);
        border-right: 1px solid var(--border);
        padding: 8px;
        overflow: hidden;
      }

      .nav .back {
        color: var(--fg-subtle);
        padding: 6px 8px;
        margin-bottom: 8px;
      }

      .nav .label {
        padding: 8px 10px 4px;
        font-size: 11px;
        color: var(--fg-subtle);
      }

      .nav .item {
        padding: 5px 10px;
        border-radius: 6px;
      }

      .nav .item.selected {
        background: var(--accent);
        box-shadow: inset 2px 0 var(--brand);
      }

      .content {
        padding: 16px;
        overflow: hidden;
      }

      .content h3 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 600;
      }

      .content p {
        margin: 0;
        color: var(--fg-subtle);
      }

      /* Marks the reserved-but-empty column so the gap is obvious. */
      .reserved {
        background: repeating-linear-gradient(
          45deg,
          rgba(255, 90, 90, 0.16) 0 6px,
          transparent 6px 12px
        );
        border-right: 1px dashed rgba(255, 90, 90, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <h2>Current — reserved column left empty (hatched)</h2>
        <div class="frame">
          <div class="workspace-shell">
            <div class="workspace-sidebar"></div>
            <div class="content"></div>
          </div>
          <div class="settings-layer">
            <div class="shell-current">
              <div class="reserved"></div>
              <div class="nav">
                <div class="back">← Back to workspace</div>
                <div class="label">General</div>
                <div class="item selected">System</div>
                <div class="item">Appearance</div>
              </div>
              <div class="content">
                <h3>Model settings</h3>
                <p>Manage custom model providers.</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div>
        <h2>Fixed — nav beside content, no reserved strip</h2>
        <div class="frame">
          <div class="workspace-shell">
            <div class="workspace-sidebar"></div>
            <div class="content"></div>
          </div>
          <div class="settings-layer">
            <div class="shell-fixed">
              <div class="nav">
                <div class="back">← Back to workspace</div>
                <div class="label">General</div>
                <div class="item selected">System</div>
                <div class="item">Appearance</div>
              </div>
              <div class="content">
                <h3>Model settings</h3>
                <p>Manage custom model providers.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
