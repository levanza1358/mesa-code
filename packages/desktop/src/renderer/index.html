<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa Code</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      /* The window is transparent, so an empty document would show the
         desktop through it. Keep a solid themed backdrop so the pre-React
         frame never looks broken. */
      body {
        background: #151718;
      }

      body[data-theme="light"] {
        background: #f8f8f8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
